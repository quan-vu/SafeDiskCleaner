[package]
name = "sdc-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2.5"
libc = "0.2"
plist = "1.10"
thiserror = "2"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
